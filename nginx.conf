server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    default_type application/octet-stream;
    # 文件上传大小限制（20MB，与后端保持一致）
    client_max_body_size 20m;
    client_body_timeout 120s;

    # AI Agent 对话接口：thinking 推理耗时长，单独设置更长的超时（300s）
    location ~* ^(/lb-api/api/forum/bot/agent/chat)(.*)$ {
        proxy_pass         http://lb-server:8088$1$2;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Hermes SSE 流式对话：关闭缓冲，支持长连接
    location /lb-api/api/hermes/chat/stream {
        proxy_pass         http://lb-server:8088/api/hermes/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # SSE 关键：关闭 nginx 响应缓冲，数据实时推送到客户端
        proxy_buffering    off;
        proxy_cache        off;
        add_header         X-Accel-Buffering no;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
    }

    # 反向代理：前端 /lb-api/* → 后端 lb-server:8088/*（放在最前，避免被正则location拦截）
    location /lb-api/ {
        proxy_pass         http://lb-server:8088/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket 支持（StompJS / Socket.IO）
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        # 上传文件时增大缓冲区
        proxy_request_buffering off;
    }

    # 静态资源长缓存（排除 /lb-api 路径） — 包含 HEIC/HEIF
    location ~* ^/(?!lb-api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HEIC/HEIF 图片单独处理（nginx 默认 mime.types 不含这两种格式）
    location ~* \.(heic|heif)$ {
        add_header Content-Type "image/heic";
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vue SPA 路由回退（放在最后）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
